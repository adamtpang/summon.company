<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Summon app icon · small-size variant (renders <= 32px: taskbar small, favicon 16/32) -->
  <!-- Strokes thickened 4.5 -> 6 so the ring and pulse survive 16px rasterization. -->
  <defs>
    <mask id="summon-tile-gap-small" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect width="64" height="64" fill="#fff"/>
      <path d="M3 32 H20 L26 21 L33 44 L38 32 H61"
            fill="none" stroke="#000" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    </mask>
  </defs>
  <rect width="64" height="64" rx="15" fill="#0A0A0A"/>
  <circle cx="32" cy="32" r="21" fill="none" stroke="#FFFFFF" stroke-width="6" mask="url(#summon-tile-gap-small)"/>
  <path d="M3 32 H20 L26 21 L33 44 L38 32 H61"
        fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
