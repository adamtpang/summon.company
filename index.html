<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Company OS</title>
<link rel="stylesheet" href="company-os.css" />
<script src="company-os.core.js"></script>
<script src="company-os.data.js"></script>
</head>
<body>
<div id="app" class="cos"></div>
<script>
  (function () {
    var el = document.getElementById("app");
    if (!window.COMPANY_OS) { el.innerHTML = '<p style="color:#d64545;padding:24px">company-os.data.js not found.</p>'; return; }
    el.innerHTML = window.CompanyOS.render(window.COMPANY_OS);
  })();
</script>
</body>
</html>
