appId: company.summon.desktop
productName: Summon

directories:
  output: dist

files:
  - main.js
  - splash.html
  - icon.ico
  - package.json

win:
  target: nsis
  icon: icon.ico

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true

