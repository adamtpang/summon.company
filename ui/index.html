<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="application-name" content="summon.company" />
    <meta name="apple-mobile-web-app-title" content="summon.company" />
    <title>summon.company</title>
    <!-- PAPERCLIP_RUNTIME_BRANDING_START -->
    <!-- PAPERCLIP_RUNTIME_BRANDING_END -->
    <!-- PAPERCLIP_FAVICON_START -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <!-- PAPERCLIP_FAVICON_END -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <script>
      (() => {
        const key = "vitals.theme";
        const darkThemeColor = "#0a0a0a";
        const lightThemeColor = "#ffffff";
        try {
          const stored = window.localStorage.getItem(key);
          const theme = stored === "light" || stored === "dark" ? stored : "light";
          const isDark = theme === "dark";
          document.documentElement.classList.toggle("dark", isDark);
          document.documentElement.style.colorScheme = isDark ? "dark" : "light";
          const themeColorMeta = document.querySelector('meta[name="theme-color"]');
          if (themeColorMeta) {
            themeColorMeta.setAttribute("content", isDark ? darkThemeColor : lightThemeColor);
          }
        } catch {
          document.documentElement.classList.remove("dark");
          document.documentElement.style.colorScheme = "light";
        }
      })();
    </script>
  
    <script id="summon-boot-guard">
      // Blank-screen guard (board, 2026-07-19): a white void is never allowed
      // to be silent. If the app has not mounted within 12s, or a fatal error
      // fires first, paint a plain diagnostic with a reload button.
      (() => {
        let fatal = null;
        const remember = (m) => { if (!fatal) fatal = String(m).slice(0, 500); };
        window.addEventListener('error', (e) => remember(e.message + ' @ ' + (e.filename || '') + ':' + (e.lineno || '')));
        window.addEventListener('unhandledrejection', (e) => remember('unhandled rejection: ' + (e.reason && e.reason.message ? e.reason.message : e.reason)));
        setTimeout(() => {
          const root = document.getElementById('root');
          if (root && root.children.length > 0) return;
          document.body.innerHTML =
            '<div style="font-family:ui-sans-serif,system-ui;max-width:34rem;margin:18vh auto;padding:0 1.5rem;color:#0a0a0a">' +
            '<p style="font-size:1.25rem;font-weight:600;margin:0">Summon did not finish loading</p>' +
            '<p style="color:#5a5a5a;margin:.5rem 0 1rem">' + (fatal ? 'Error: ' + fatal.replace(/</g, '&lt;') : 'Usually a stale page after an update — reload fixes it.') + '</p>' +
            '<button onclick="location.reload(true)" style="background:#0a0a0a;color:#fff;border:0;border-radius:.5rem;padding:.6rem 1.2rem;font-size:.95rem;cursor:pointer">Reload</button>' +
            '</div>';
        }, 12000);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
