<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="application-name" content="summon.company" />
    <meta name="apple-mobile-web-app-title" content="summon.company" />
    <title>summon.company</title>
    <!-- PAPERCLIP_RUNTIME_BRANDING_START -->
    <!-- PAPERCLIP_RUNTIME_BRANDING_END -->
    <!-- PAPERCLIP_FAVICON_START -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <!-- PAPERCLIP_FAVICON_END -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <script>
      (() => {
        const key = "vitals.theme";
        const darkThemeColor = "#0a0a0a";
        const lightThemeColor = "#ffffff";
        try {
          const stored = window.localStorage.getItem(key);
          const preference = stored === "light" || stored === "dark" || stored === "system" ? stored : "light";
          const theme = preference === "system"
            ? (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
            : preference;
          const isDark = theme === "dark";
          document.documentElement.classList.toggle("dark", isDark);
          document.documentElement.style.colorScheme = isDark ? "dark" : "light";
          const themeColorMeta = document.querySelector('meta[name="theme-color"]');
          if (themeColorMeta) {
            themeColorMeta.setAttribute("content", isDark ? darkThemeColor : lightThemeColor);
          }
        } catch {
          document.documentElement.classList.remove("dark");
          document.documentElement.style.colorScheme = "light";
        }
      })();
    </script>
  
    <script id="summon-boot-guard">
      // Blank-screen guard (board, 2026-07-19): a white void is never allowed
      // to be silent. Keep #root intact so a slow dev boot can still recover
      // after this diagnostic appears.
      (() => {
        const recoveryKey = "summon.boot-recovery-attempt";
        const recoveryWindowMs = 30000;
        const retryDelayMs = 1500;
        const isLocalRuntime = window.location.hostname === '127.0.0.1' || window.location.hostname === 'localhost';
        const fallbackDelayMs = isLocalRuntime ? 30000 : 12000;
        let fatal = null;
        let runtimeWasUnavailable = false;
        const remember = (m) => { if (!fatal) fatal = String(m).slice(0, 500); };
        const recoveryAttemptedRecently = () => {
          try {
            const attemptedAt = Number(window.sessionStorage.getItem(recoveryKey));
            return Number.isFinite(attemptedAt) && Date.now() - attemptedAt < recoveryWindowMs;
          } catch {
            return false;
          }
        };
        const markRecoveryAttempt = () => {
          try {
            window.sessionStorage.setItem(recoveryKey, String(Date.now()));
          } catch {
            // Storage can be unavailable in hardened browser modes. One reload
            // remains safer than leaving a healthy local runtime stranded.
          }
        };
        const clearRecoveryAttempt = () => {
          try {
            window.sessionStorage.removeItem(recoveryKey);
          } catch {
            // The manual reload still works when storage is unavailable.
          }
        };
        window.addEventListener('error', (e) => remember(e.message + ' @ ' + (e.filename || '') + ':' + (e.lineno || '')));
        window.addEventListener('unhandledrejection', (e) => remember('unhandled rejection: ' + (e.reason && e.reason.message ? e.reason.message : e.reason)));
        setTimeout(() => {
          const root = document.getElementById('root');
          if (root && root.children.length > 0) return;
          const headline = fatal ? 'Summon could not load' : 'Summon is still loading';
          root.innerHTML =
            '<div data-summon-boot-fallback role="alert" style="font-family:ui-sans-serif,system-ui;max-width:34rem;margin:18vh auto;padding:0 1.5rem;color:#0a0a0a">' +
            '<p style="font-size:1.25rem;font-weight:600;margin:0">' + headline + '</p>' +
            '<p data-summon-boot-status style="color:#5a5a5a;margin:.5rem 0 1rem">' + (fatal ? 'Error: ' + fatal.replace(/</g, '&lt;') : 'Checking the local runtime without interrupting this load…') + '</p>' +
            '<button data-summon-boot-reload type="button" style="background:#0a0a0a;color:#fff;border:0;border-radius:.5rem;padding:.6rem 1.2rem;font-size:.95rem;cursor:pointer">Reload Summon</button>' +
            '</div>';

          const reloadButton = root.querySelector('[data-summon-boot-reload]');
          reloadButton?.addEventListener('click', () => {
            clearRecoveryAttempt();
            window.location.reload();
          });

          const checkRuntime = () => {
            window.fetch('/api/health', { cache: 'no-store' })
              .then((response) => {
                if (!response.ok) throw new Error('runtime unavailable');
                const status = root.querySelector('[data-summon-boot-status]');
                if (!runtimeWasUnavailable) {
                  if (status) status.textContent = 'Runtime ready. The interface is still compiling and will replace this message automatically.';
                  return;
                }
                if (recoveryAttemptedRecently()) {
                  if (status) status.textContent = 'Runtime recovered. Use Reload Summon to retry this page.';
                  return;
                }
                markRecoveryAttempt();
                if (status) status.textContent = 'Runtime recovered. Reloading Summon once…';
                window.location.reload();
              })
              .catch(() => {
                runtimeWasUnavailable = true;
                const status = root.querySelector('[data-summon-boot-status]');
                if (status) status.textContent = 'Waiting for the local runtime to become ready…';
                setTimeout(checkRuntime, retryDelayMs);
              });
          };
          checkRuntime();
        }, fallbackDelayMs);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
